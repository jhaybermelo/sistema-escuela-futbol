services:
  postgres-db:
    image: postgres:15
    container_name: escuela-futbol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Bogota
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - escuela-futbol-net

  backend:
    build: ./backend
    container_name: escuela-futbol-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - escuela-futbol-net

  frontend:
    build: ./frontend
    container_name: escuela-futbol-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - escuela-futbol-net

volumes:
  pgdata:
  uploads:

networks:
  escuela-futbol-net:
    driver: bridge
